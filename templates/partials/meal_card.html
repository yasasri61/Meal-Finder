<article class="meal-card">
    <a href="{% url 'meal_detail' meal.pk %}" class="meal-image-wrap">
        {% if meal.image_url %}<img src="{{ meal.image_url }}" alt="{{ meal.name }}" loading="lazy">{% else %}<div class="image-fallback">🍽️</div>{% endif %}
        <span class="time-badge">⏱ {{ meal.cooking_time }}m</span>
    </a>
    <div class="meal-card-body">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <div><span class="meal-category">{{ meal.category.name }}</span><h3>{{ meal.name }}</h3></div>
            <span class="rating">★ {{ meal.rating }}</span>
        </div>
        <p>{{ meal.description|truncatechars:85 }}</p>
        <a href="{% url 'meal_detail' meal.pk %}" class="stretched-link visually-hidden">View</a>
    </div>
</article>
